[SERVICE]
    Flush         1
    Daemon        Off
    Log_File      /dev/stdout
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On

[INPUT]
    Name          tail
    Path          ${FILE_PATH}
    DB            C:\testdata\flb.db

[OUTPUT]
    Name          newrelic
    Match         *
    apiKey        ${API_KEY}
    licenseKey    ${LICENSE_KEY}
    endpoint      ${ENDPOINT}
